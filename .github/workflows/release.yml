name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: contract-linux-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: contract-darwin-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_name: contract-darwin-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: contract-windows-x64

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir -p package
          cp target/${{ matrix.target }}/release/contract package/
          tar -czvf ${{ matrix.archive_name }}.tar.gz -C package contract
      - name: Package archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package
          Copy-Item target/${{ matrix.target }}/release/contract.exe package/
          Compress-Archive -Path package/* -DestinationPath ${{ matrix.archive_name }}.zip
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            contract-*.tar.gz
            contract-*.zip
