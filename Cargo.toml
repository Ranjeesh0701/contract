[package]
name = "contract"
version = "0.1.0"
edition = "2024"
authors = ["Ranjeesh"]
description = "Universal API contract language with zero-drift synchronization, multi-language codegen, and AI-agent compatibility"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Ranjeesh0701/contract"
homepage = "https://github.com/Ranjeesh0701/contract"
keywords = ["contract", "api", "schema", "codegen", "cli"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "/src/**/*",
    "/tests/**/*",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
]

[lib]
name = "contract"
path = "src/lib.rs"

[[bin]]
name = "contract"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
toml = "0.8"
