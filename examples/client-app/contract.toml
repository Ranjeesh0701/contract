[project]
name = "storefront-web"
version = "0.1.0"

[dependencies]
store = { path = "../schema.contract" }
pets = { path = "../petstore.json" }

[[generate]]
contract = "store"
lang = "ts"
out = "src/api/store.ts"

[[generate]]
contract = "pets"
lang = "ts"
out = "src/api/pets.ts"

[[generate]]
contract = "store"
lang = "python"
out = "src/api/store.py"

[[generate]]
contract = "pets"
lang = "python"
out = "src/api/pets.py"
